name: Publish progress dashboard

on:
  push:
    branches: [main]
    paths:
      - "docs/ROADMAP.md"
      - "docs/PROJECT_STATE.md"
      - "scripts/generate_progress_dashboard.py"
      - "scripts/test_progress_dashboard.py"
      - ".github/workflows/progress-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: __DOLLAR__{{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: __DOLLAR__{{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test dashboard generator
        run: python -m unittest discover -s scripts -p "test_progress_dashboard.py" -v

      - name: Generate dashboard
        run: python scripts/generate_progress_dashboard.py --output-dir _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
