name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        working-directory: rust
        run: cargo test --workspace --locked

      - name: CMake configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: CMake build
        run: cmake --build build --config Release --parallel

      - name: CTest
        run: ctest --test-dir build -C Release --output-on-failure

      - name: CLI smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build\cargo-target\release\reps2.exe version

      - name: CLI smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./build/cargo-target/release/reps2 version
