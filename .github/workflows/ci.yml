name: CI

on:
  push:
    branches: [main, "feat/**", "feature/**", "fix/**", "work/**", "docs/**", "test/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rustfmt
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        working-directory: rust
        run: cargo test --workspace --locked

      - name: CMake configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: CMake build
        run: cmake --build build --config Release --parallel

      - name: CTest
        run: ctest --test-dir build -C Release --output-on-failure

      - name: CLI smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build\cargo-target\release\reps2.exe version

      - name: CLI smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./build/cargo-target/release/reps2 version

      - name: Developer diagnostics smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $logRoot = Join-Path $env:RUNNER_TEMP 'reps2-dev-diagnostics'
          $successRoot = Join-Path $logRoot 'success'
          $failureRoot = Join-Path $logRoot 'failure'
          & .\build\cargo-target\release\reps2.exe --dev --log-dir $successRoot version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sessions = @(Get-ChildItem -LiteralPath $successRoot -Directory)
          if ($sessions.Count -ne 1) { throw "Expected one successful diagnostics session, found $($sessions.Count)" }
          foreach ($name in @('session.log', 'events.jsonl', 'session.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $sessions[0].FullName $name) -PathType Leaf)) {
              throw "Missing diagnostics artifact: $name"
            }
          }
          $events = Get-Content -LiteralPath (Join-Path $sessions[0].FullName 'events.jsonl') -Raw
          if ($events -notmatch '"event":"session.finished"') { throw 'Missing terminal session event' }
          $manifest = Get-Content -LiteralPath (Join-Path $sessions[0].FullName 'session.json') -Raw | ConvertFrom-Json
          if ($manifest.outcome -ne 'succeeded') { throw "Unexpected session outcome: $($manifest.outcome)" }
          $eventRecords = @(Get-Content -LiteralPath (Join-Path $sessions[0].FullName 'events.jsonl') | ForEach-Object { $_ | ConvertFrom-Json })
          if ($eventRecords.Count -lt 2) { throw 'Expected session start and finish event records' }
          if ($eventRecords[-1].event -ne 'session.finished') { throw 'Last event is not the terminal session event' }

          & .\build\cargo-target\release\reps2.exe --log-dir $failureRoot invalid-command
          if ($LASTEXITCODE -ne 1) { throw "Expected invalid command exit code 1, received $LASTEXITCODE" }
          $failedSessions = @(Get-ChildItem -LiteralPath $failureRoot -Directory)
          if ($failedSessions.Count -ne 1) { throw "Expected one failed diagnostics session, found $($failedSessions.Count)" }
          $failedManifest = Get-Content -LiteralPath (Join-Path $failedSessions[0].FullName 'session.json') -Raw | ConvertFrom-Json
          if ($failedManifest.outcome -ne 'failed') { throw "Unexpected failed-session outcome: $($failedManifest.outcome)" }
          $failedEvents = @(Get-Content -LiteralPath (Join-Path $failedSessions[0].FullName 'events.jsonl') | ForEach-Object { $_ | ConvertFrom-Json })
          if ($failedEvents[-1].event -ne 'session.finished' -or $failedEvents[-1].severity -ne 'error') {
            throw 'Failed session does not end with an error event'
          }
          if ($failedEvents[-1].context.error -ne 'invalid command-line arguments') {
            throw 'Failed session did not preserve the command error'
          }

          $sessionList = & .\build\cargo-target\release\reps2.exe --log-dir $failureRoot dev sessions --limit 5 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "dev sessions failed with exit code $LASTEXITCODE" }
          if ($sessionList.kind -ne 'reps2.developer.session_list' -or $sessionList.count -ne 1 -or $sessionList.available_count -ne 1 -or $sessionList.truncated) {
            throw 'dev sessions did not return the expected JSON session list and truncation metadata'
          }
          $inspection = & .\build\cargo-target\release\reps2.exe --log-dir $failureRoot dev inspect latest | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "dev inspect failed with exit code $LASTEXITCODE" }
          if ($inspection.kind -ne 'reps2.developer.session_inspection' -or -not $inspection.complete) {
            throw 'dev inspect did not return a complete session inspection'
          }
          $commandFailure = @($inspection.diagnostics | Where-Object { $_.event -eq 'command.failed' })
          if ($commandFailure.Count -ne 1) { throw "Expected one command.failed diagnostic, found $($commandFailure.Count)" }
          if ($commandFailure[0].subsystem -ne 'cli' -or $commandFailure[0].context.error_code -ne 'REPS2_COMMAND_FAILED') {
            throw 'Command failure is missing subsystem attribution or stable error code'
          }
          $missingReport = & .\build\cargo-target\release\reps2.exe --log-dir $failureRoot dev inspect session-9999999999999-1-0 2>$null
          $missingStatus = $LASTEXITCODE
          $missingJson = $missingReport | ConvertFrom-Json
          if ($missingStatus -ne 1 -or $missingJson.error.code -ne 'REPS2_DEV_SESSION_INSPECTION_FAILED') {
            throw 'Missing-session inspection did not return a machine-readable error and non-zero exit code'
          }
          exit 0

      - name: Developer diagnostics smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          log_root="$RUNNER_TEMP/reps2-dev-diagnostics"
          success_root="$log_root/success"
          failure_root="$log_root/failure"
          ./build/cargo-target/release/reps2 --dev --log-dir "$success_root" version
          session_dir="$(find "$success_root" -mindepth 1 -maxdepth 1 -type d -name 'session-*' -print -quit)"
          test -n "$session_dir"
          test -s "$session_dir/session.log"
          test -s "$session_dir/events.jsonl"
          test -s "$session_dir/session.json"
          grep -q '"event":"session.finished"' "$session_dir/events.jsonl"
          grep -q '"outcome": "succeeded"' "$session_dir/session.json"
          python -c 'import json, pathlib, sys; p=pathlib.Path(sys.argv[1]); data=json.loads(p.read_text()); assert data["outcome"] == "succeeded"' "$session_dir/session.json"
          python -c 'import json, pathlib, sys; rows=[json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]; assert len(rows) >= 2 and rows[-1]["event"] == "session.finished"; assert rows[-1]["sequence"] == len(rows)' "$session_dir/events.jsonl"

          set +e
          ./build/cargo-target/release/reps2 --log-dir "$failure_root" invalid-command >/dev/null 2>&1
          failure_status=$?
          set -e
          test "$failure_status" -eq 1
          failed_session_dir="$(find "$failure_root" -mindepth 1 -maxdepth 1 -type d -name 'session-*' -print -quit)"
          test -n "$failed_session_dir"
          python -c 'import json, pathlib, sys; p=pathlib.Path(sys.argv[1]); data=json.loads(p.read_text()); assert data["outcome"] == "failed"' "$failed_session_dir/session.json"
          python -c 'import json, pathlib, sys; rows=[json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]; final=rows[-1]; assert final["event"] == "session.finished" and final["severity"] == "error"; assert final["context"]["error"] == "invalid command-line arguments"' "$failed_session_dir/events.jsonl"


          session_list_json="$(./build/cargo-target/release/reps2 --log-dir "$failure_root" dev sessions --limit 5)"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["kind"]=="reps2.developer.session_list" and d["count"]==1 and d["available_count"]==1 and not d["truncated"]' "$session_list_json"
          session_inspection_json="$(./build/cargo-target/release/reps2 --log-dir "$failure_root" dev inspect latest)"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["kind"]=="reps2.developer.session_inspection" and d["complete"]; f=[e for e in d["diagnostics"] if e["event"]=="command.failed"]; assert len(f)==1 and f[0]["subsystem"]=="cli" and f[0]["context"]["error_code"]=="REPS2_COMMAND_FAILED"; assert d["event_count"]>=4' "$session_inspection_json"
          set +e
          missing_report="$(./build/cargo-target/release/reps2 --log-dir "$failure_root" dev inspect session-9999999999999-1-0 2>/dev/null)"
          missing_status=$?
          set -e
          test "$missing_status" -eq 1
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["kind"]=="reps2.developer.error" and d["status"]=="error" and d["error"]["code"]=="REPS2_DEV_SESSION_INSPECTION_FAILED"' "$missing_report"

      - name: Upload developer diagnostics smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reps2-developer-diagnostics-${{ runner.os }}
          path: ${{ runner.temp }}/reps2-dev-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  msrv:
    name: Rust frontend (MSRV 1.88)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Unit tests
        working-directory: rust
        run: cargo test --workspace --locked

  progress-dashboard:
    name: Progress dashboard generator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dashboard rendering dependencies
        run: python -m pip install -r scripts/dashboard-requirements.txt

      - name: Dashboard unit tests
        run: python -m unittest discover -s scripts -p "test_progress_dashboard.py" -v

      - name: Render dashboard
        run: |
          python scripts/generate_progress_dashboard.py --output-dir build/progress-dashboard
          python -c "import xml.etree.ElementTree as ET; ET.parse('build/progress-dashboard/progress.svg')"
          python -c "from PIL import Image; image = Image.open('build/progress-dashboard/progress.png'); image.verify()"
          test -s build/progress-dashboard/progress.json
          test -s build/progress-dashboard/progress.png
          test -s build/progress-dashboard/index.html
